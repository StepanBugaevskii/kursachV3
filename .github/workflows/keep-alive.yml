name: Keep Render Alive

on:
  schedule:
    # Пинг каждые 10 минут (Render засыпает через 15 минут)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -f ${{ secrets.BACKEND_URL }}/health || echo "Backend is sleeping, waking up..."
          sleep 5
          curl -f ${{ secrets.BACKEND_URL }}/health && echo "Backend is alive!"
